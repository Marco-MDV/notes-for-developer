<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML and CSS effects</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <main>
        <h1>Gradient text</h1>

        <div class="examples">
            <figure>
                <img class="img1" src="../assets/img/PNG_transparency_demonstration_1.png"
                     alt="Transparent PNG with a rectangular shadow">
                <figcaption>Box shadow</figcaption>
            </figure>
            <figure>
                <img class="img2" src="../assets/img/PNG_transparency_demonstration_1.png"
                     alt="Transparent PNG with a shadow that follows its outline">
                <figcaption>Drop shadow</figcaption>
            </figure>
        </div>

        <h2>Card hover effects</h2>
        <div class="cards">
            <p class="card red">Red</p>
            <p class="card blue">Blue</p>
            <p class="card green">Green</p>
        </div>
    </main>
</body>
</html>
